<!doctype html><title>top</title>
<style>body{margin:0;font:12px sans-serif}iframe{display:block;border:0;width:260px;height:80px;margin:10px 0 0 30px}
#l li{padding:4px;background:#ddd;margin:2px;list-style:none;width:120px}</style>
<iframe id="same" src="/same.html"></iframe>
<iframe id="cross" src="http://localhost:__B__/oopif.html"></iframe>
<ul id="l"><li draggable="true" id="d1">one</li><li draggable="true" id="d2">two</li><li draggable="true" id="d3">three</li></ul>
<script>
window.dropLog=[];let src=null;
for(const li of document.querySelectorAll('li')){
 li.addEventListener('dragstart',e=>{src=li;e.dataTransfer.setData('text/plain',li.id);e.dataTransfer.effectAllowed='move'});
 li.addEventListener('dragover',e=>e.preventDefault());
 li.addEventListener('drop',e=>{e.preventDefault();dropLog.push(src.id+'->'+li.id);li.after(src)});}
</script>
