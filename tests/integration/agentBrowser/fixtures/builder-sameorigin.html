<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Same-origin builder</title>
    <style>
      iframe {
        position: absolute;
        border: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <button>Top action</button>
    <iframe title="GHL builder" src="/child.html" style="left: 30px; top: 100px; width: 400px; height: 200px"></iframe>
    <iframe name="collapsed" src="/child.html" style="left: 30px; top: 320px; width: 0; height: 0"></iframe>
    <iframe name="far away" src="/child.html" style="left: 30px; top: 5000px; width: 400px; height: 200px"></iframe>
  </body>
</html>
