<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm gate</title>
  </head>
  <body>
    <form id="mail">
      <input id="to" type="text" aria-label="To" />
      <button type="submit">Send message</button>
    </form>
    <form id="find">
      <input id="q" type="search" aria-label="Query" />
      <button type="submit">Search</button>
    </form>
    <button id="del" type="button">Delete account</button>
    <input id="composer" type="text" aria-label="Send a message" />
    <form id="dlg"><input id="dtitle" type="text" aria-label="Dialog title" /></form>
    <div><button type="submit" form="dlg">Publish</button></div>
    <div id="divdel" onclick="window.divDeleted++">Delete</div>
    <label for="unsub">Unsubscribe</label><input id="unsub" type="checkbox" />
    <div id="card" draggable="true">Card</div>
    <button id="pub" type="button" style="width: 240px; height: 70px" onclick="window.pubClicks++">
      <span id="handle" draggable="true">Publish draft</span>
    </button>
    <button id="bold" type="button" onmousedown="event.preventDefault()">Bold</button>
    <form id="img"><input id="imgq" type="text" aria-label="Image query" /></form>
    <input type="image" form="img" alt="Purchase" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />
    <button id="svgdel" type="button" style="cursor: pointer" onclick="window.svgDeleted++">
      <svg id="ico" width="40" height="40"><circle cx="20" cy="20" r="18"></circle></svg>Delete account
    </button>
    <a id="co" href="#co" style="cursor: pointer" onclick="window.checkouts++; return false">
      <img id="cart" alt="" width="40" height="40" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" />Checkout
    </a>
    <button id="wrap" type="button" onclick="window.wraps++">
      <span draggable="true" aria-label="Grip">::</span> Remove item
    </button>
    <select id="sel" aria-label="Action" onchange="window.selChanged++">
      <option>Choose</option>
      <option>Delete selected</option>
    </select>
    <script>
      window.svgDeleted = 0;
      window.checkouts = 0;
      window.wraps = 0;
      window.selChanged = 0;
      window.divDeleted = 0;
      window.pubClicks = 0;
      window.submits = [];
      window.deleted = 0;
      for (const form of document.forms) {
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          window.submits.push(form.id);
        });
      }
      document.getElementById('del').addEventListener('click', () => {
        window.deleted += 1;
      });
    </script>
  </body>
</html>
